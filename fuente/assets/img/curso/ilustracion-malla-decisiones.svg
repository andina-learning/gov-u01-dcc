  <rect x="718" y="302" width="40" height="8" rx="4" fill="#132B41" opacity=".14"/>

  <!-- La casilla vacía, sobre el hilo que llega al perfil de egreso -->
  <rect x="464" y="164" width="92" height="44" rx="10" fill="#F6F8FB" stroke="#00417B" stroke-width="2.5" stroke-dasharray="7 6" opacity=".9"/>
  <!-- La pieza que está por encajar: la decisión (único amarillo) -->
  <g transform="translate(526 162) rotate(-8)" filter="url(#ilu-amb-intro-sombra-pieza)">
    <rect x="-46" y="-22" width="92" height="44" rx="10" fill="#F0B443"/>
    <rect x="-32" y="-4" width="40" height="8" rx="4" fill="#FFFFFF" opacity=".6"/>
  </g>

  <!-- La persona egresada: birrete, maletín (la profesión) -->
  <ellipse cx="1014" cy="316" rx="86" ry="8" fill="#132B41" opacity=".08"/>
  <g fill="none" stroke="#00417B" stroke-width="5" stroke-linecap="round">
    <circle cx="1010" cy="226" r="27" fill="#FFFFFF"/>
    <path d="M958 306 a52 42 0 0 1 104 0"/>
  </g>
  <path d="M984 196 v14 q26 13 52 0 v-14 z" fill="#00417B" opacity=".6"/>
  <path d="M1010 176 l56 18 l-56 18 l-56 -18 z" fill="#00417B"/>
  <line x1="1066" y1="194" x2="1066" y2="220" stroke="#00417B" stroke-width="3" stroke-linecap="round"/>
