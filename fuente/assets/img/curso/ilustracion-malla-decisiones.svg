  <rect x="704" y="104" width="92" height="44" rx="10" fill="#84C9BF"/>
  <rect x="718" y="122" width="40" height="8" rx="4" fill="#FFFFFF" opacity=".55"/>
  <rect x="104" y="284" width="92" height="44" rx="10" fill="#E3E9F1"/>
