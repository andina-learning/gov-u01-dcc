<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img"
     aria-label="Un tablero de malla curricular con seis columnas de asignaturas. Hilos de color unen asignaturas de una columna a otra y salen del tablero hacia una persona egresada con birrete y maletín. Una de las casillas está vacía, con borde punteado, y una pieza amarilla está a punto de encajar en ella, sobre el hilo que llega a la persona egresada.">
  <!-- Ilustración de marca · Universidad Andina Virtual · gov-u01-dcc · introducción (ambientación,
       bajo el título, en lugar de la caja de las tres preguntas; las preguntas siguen debajo como texto)
       Concepto (DI, P33): «una malla curricular no es una simple lista de asignaturas. Cada decisión
       debe poder explicarse y relacionarse con el perfil de egreso…»; con P28 («un sistema de
       decisiones articuladas»), P31 («por qué cada asignatura ocupa el lugar que ocupa», «su
       progresión a lo largo de la formación») y P25 («un currículo [que] realmente prepare a una
       persona para desempeñarse en su profesión»).
       Único amarillo: la pieza que está por encajar en la casilla vacía (la decisión que se toma).
       Sin texto. Cuadros de la malla = guiño a los cuadros pixelados de la marca. Una estrella. -->
  <defs>
    <linearGradient id="ilu-amb-intro-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#E6F3FA"/>
      <stop offset="55%"  stop-color="#E8EDF5"/>
      <stop offset="100%" stop-color="#F5F8FB"/>
    </linearGradient>
    <filter id="ilu-amb-intro-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#132B41" flood-opacity="0.16"/>
    </filter>
    <filter id="ilu-amb-intro-sombra-pieza" x="-40%" y="-60%" width="180%" height="240%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#132B41" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#ilu-amb-intro-fondo)"/>

  <!-- Halo detrás de la persona egresada y la estrella de la marca (una) -->
  <circle cx="1010" cy="232" r="122" fill="#FFFFFF" opacity=".6"/>
  <circle cx="1010" cy="232" r="84" fill="#B5E3EF" opacity=".35"/>
  <path transform="translate(1114 46) scale(.3)" fill="#ED6A48" d="M50 0C53 36 64 47 100 50C64 53 53 64 50 100C47 64 36 53 0 50C36 47 47 36 50 0Z"/>

  <!-- El tablero de la malla curricular -->
  <rect x="70" y="44" width="760" height="314" rx="20" fill="#FFFFFF" filter="url(#ilu-amb-intro-sombra)"/>
  <g fill="#00417B" opacity=".28">
    <rect x="104" y="70" width="56" height="9" rx="4.5"/>
    <rect x="224" y="70" width="56" height="9" rx="4.5"/>
    <rect x="344" y="70" width="56" height="9" rx="4.5"/>
    <rect x="464" y="70" width="56" height="9" rx="4.5"/>
    <rect x="584" y="70" width="56" height="9" rx="4.5"/>
    <rect x="704" y="70" width="56" height="9" rx="4.5"/>
  </g>

  <!-- Los hilos: asignaturas articuladas de un periodo a otro, hasta el perfil de egreso -->
  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 126 L270 126 L390 186 L510 126 L630 126 L750 126 L796 126 C 880 126, 890 262, 958 262" stroke="#84C9BF"/>
    <path d="M150 186 L270 186 L390 126 L510 186 L630 186 L750 186 L796 186 C 880 186, 890 262, 958 262" stroke="#00417B"/>
    <path d="M150 246 L270 306 L390 246 L510 246 L630 306 L750 246 L796 246 C 880 246, 890 262, 958 262" stroke="#3A93D0"/>
  </g>
  <circle cx="958" cy="262" r="7" fill="#00417B"/>

  <!-- Las asignaturas -->
  <rect x="104" y="164" width="92" height="44" rx="10" fill="#00417B"/>
  <rect x="118" y="182" width="40" height="8" rx="4" fill="#FFFFFF" opacity=".55"/>
  <rect x="224" y="164" width="92" height="44" rx="10" fill="#00417B"/>
  <rect x="238" y="182" width="40" height="8" rx="4" fill="#FFFFFF" opacity=".55"/>
