  <rect x="704" y="224" width="92" height="44" rx="10" fill="#3A93D0"/>
  <rect x="718" y="242" width="40" height="8" rx="4" fill="#FFFFFF" opacity=".55"/>
  <rect x="104" y="104" width="92" height="44" rx="10" fill="#84C9BF"/>
  <rect x="118" y="122" width="40" height="8" rx="4" fill="#FFFFFF" opacity=".55"/>
  <rect x="224" y="104" width="92" height="44" rx="10" fill="#84C9BF"/>
  <rect x="238" y="122" width="40" height="8" rx="4" fill="#FFFFFF" opacity=".55"/>
  <rect x="344" y="164" width="92" height="44" rx="10" fill="#84C9BF"/>
  <rect x="358" y="182" width="40" height="8" rx="4" fill="#FFFFFF" opacity=".55"/>
  <rect x="464" y="104" width="92" height="44" rx="10" fill="#84C9BF"/>
  <rect x="478" y="122" width="40" height="8" rx="4" fill="#FFFFFF" opacity=".55"/>
  <rect x="584" y="104" width="92" height="44" rx="10" fill="#84C9BF"/>
