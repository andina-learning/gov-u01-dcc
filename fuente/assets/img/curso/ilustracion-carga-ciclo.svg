<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img"
     aria-label="Una malla curricular de cinco columnas, una por ciclo. Cuatro columnas tienen tres asignaturas y, en una de ellas, un trabajo con gráfico. La columna del centro, resaltada en amarillo, tiene seis asignaturas, cada una con su trabajo, y se sale por arriba del tablero. A la derecha, un círculo con una marca de visto bueno. Debajo, los rótulos: un mismo ciclo y número total de créditos requerido.">
  <!-- Ilustración de marca · Universidad Andina Virtual · gov-u01-dcc · tema 3 (cuerpo, 3.2, después de P959)
       Concepto (DI, P959): «Una malla puede cumplir con el número total de créditos requerido y, aun así, concentrar
       demasiadas asignaturas con productos complejos en un mismo ciclo. Por eso conviene entender la carga del periodo
       como un conjunto y no solamente asignatura por asignatura.»
       Rótulos: «un mismo ciclo» y «número total de créditos requerido» (P959), literales.
       Único amarillo: el ciclo que concentra las asignaturas con productos complejos.
       Sin estrella: la pantalla ya la trae. Guion en insumos/ILUSTRACIONES.md. -->
  <defs>
    <linearGradient id="ilu-carga-ciclo-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#E6F3FA"/>
      <stop offset="55%"  stop-color="#E8EDF5"/>
      <stop offset="100%" stop-color="#F5F8FB"/>
    </linearGradient>
    <filter id="ilu-carga-ciclo-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#132B41" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#ilu-carga-ciclo-fondo)"/>

  <!-- El tablero de la malla -->
  <rect x="80" y="104" width="700" height="196" rx="16" fill="#FFFFFF" filter="url(#ilu-carga-ciclo-sombra)"/>
  <!-- Los ciclos de siempre: tres asignaturas y, como mucho, un trabajo -->
