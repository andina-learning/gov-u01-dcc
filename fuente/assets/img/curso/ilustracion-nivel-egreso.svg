<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img"
     aria-label="A la izquierda, una persona recién egresada, con birrete, de pie en el suelo y con el brazo levantado. Muy por encima de su mano flota una tarjeta amarilla con un equipo de tres personas: una competencia. A la derecha, una escalera de diez peldaños; en el último, a la misma altura de la tarjeta, una persona con maletín. Debajo, los rótulos: al finalizar el programa y diez años de experiencia.">
  <!-- Ilustración de marca · Universidad Andina Virtual · gov-u01-dcc · tema 2 (cuerpo, 2.1, entre P570 y P572)
       Concepto (DI, P570): «¿Puede un estudiante que acaba de terminar un programa universitario desempeñarse
       exactamente igual que un profesional con diez años de experiencia? […] declarar desempeños que exceden las
       posibilidades reales de la formación.» Con P572 («Una competencia como “lidera equipos multidisciplinarios en
       proyectos de alta complejidad” […] podría requerir experiencias y niveles de autonomía propios de una
       trayectoria profesional más amplia») y P577 («un estudiante al finalizar el programa»).
       Rótulos: «al finalizar el programa» (P577) y «diez años de experiencia» (P570), literales.
       Único amarillo: la competencia declarada, a la altura del profesional y fuera del alcance del egresado.
       Sin estrella: la pantalla ya la trae. Guion en insumos/ILUSTRACIONES.md. -->
  <defs>
    <linearGradient id="ilu-nivel-egreso-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#E6F3FA"/>
      <stop offset="55%"  stop-color="#E8EDF5"/>
      <stop offset="100%" stop-color="#F5F8FB"/>
    </linearGradient>
    <filter id="ilu-nivel-egreso-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#132B41" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#ilu-nivel-egreso-fondo)"/>

  <!-- El suelo -->
  <line x1="200" y1="300" x2="1000" y2="300" stroke="#132B41" stroke-width="3" stroke-linecap="round" opacity=".18"/>

  <!-- ══ La trayectoria profesional: diez peldaños, uno por año ══ -->
  <path d="M430 300 L430 282 L478 282 L478 264 L526 264 L526 246 L574 246 L574 228 L622 228 L622 210 L670 210 L670 192 L718 192 L718 174 L766 174 L766 156 L814 156 L814 138 L862 138 L862 120 L910 120 L910 300 Z" fill="#FFFFFF" filter="url(#ilu-nivel-egreso-sombra)"/>
  <g stroke="#132B41" stroke-width="1.5" opacity=".12"><line x1="478" y1="264" x2="478" y2="300"/><line x1="526" y1="246" x2="526" y2="300"/><line x1="574" y1="228" x2="574" y2="300"/><line x1="622" y1="210" x2="622" y2="300"/><line x1="670" y1="192" x2="670" y2="300"/><line x1="718" y1="174" x2="718" y2="300"/><line x1="766" y1="156" x2="766" y2="300"/><line x1="814" y1="138" x2="814" y2="300"/><line x1="862" y1="120" x2="862" y2="300"/></g>
  <g stroke="#3A93D0" stroke-width="5" stroke-linecap="round"><line x1="430" y1="282" x2="478" y2="282"/><line x1="478" y1="264" x2="526" y2="264"/><line x1="526" y1="246" x2="574" y2="246"/><line x1="574" y1="228" x2="622" y2="228"/><line x1="622" y1="210" x2="670" y2="210"/><line x1="670" y1="192" x2="718" y2="192"/><line x1="718" y1="174" x2="766" y2="174"/><line x1="766" y1="156" x2="814" y2="156"/><line x1="814" y1="138" x2="862" y2="138"/><line x1="862" y1="120" x2="910" y2="120"/></g>
  <path d="M430 300 L430 282 L478 282 L478 264 L526 264 L526 246 L574 246 L574 228 L622 228 L622 210 L670 210 L670 192 L718 192 L718 174 L766 174 L766 156 L814 156 L814 138 L862 138 L862 120 L910 120 L910 300 Z" fill="none" stroke="#00417B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- el profesional, en el último peldaño, con su maletín -->
  <circle cx="886" cy="46" r="15" fill="#00417B"/>
  <path d="M866 120 L866 82 Q866 64 886 64 Q906 64 906 82 L906 120 Z" fill="#00417B"/>
  <g fill="#FFFFFF" stroke="#00417B" stroke-width="3.5" stroke-linejoin="round">
    <path d="M918 98 v-6 h16 v6" fill="none"/>
    <rect x="910" y="98" width="32" height="22" rx="4"/>
  </g>
  <line x1="902" y1="92" x2="916" y2="100" stroke="#00417B" stroke-width="6" stroke-linecap="round"/>

  <!-- la misma altura: la competencia corresponde al último peldaño -->
  <line x1="420" y1="100" x2="852" y2="100" stroke="#3A93D0" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- ══ La competencia declarada · ÚNICO AMARILLO ══ -->
  <rect x="280" y="66" width="130" height="68" rx="12" fill="#F0B443" filter="url(#ilu-nivel-egreso-sombra)"/>
  <!-- un equipo de tres personas -->
  <g transform="translate(10 0)">
  <g fill="#132B41">
    <circle cx="305" cy="90" r="8"/>
    <path d="M291 116 Q291 102 305 102 Q319 102 319 116 Z"/>
    <circle cx="365" cy="90" r="8"/>
    <path d="M351 116 Q351 102 365 102 Q379 102 379 116 Z"/>
  </g>
  <g fill="#132B41">
    <circle cx="335" cy="84" r="10"/>
    <path d="M317 118 Q317 98 335 98 Q353 98 353 118 Z" stroke="#F0B443" stroke-width="3"/>
  </g>
  </g>

  <!-- la distancia que el egresado no alcanza -->
  <line x1="345" y1="146" x2="345" y2="184" stroke="#132B41" stroke-width="2.5" stroke-dasharray="3 7" stroke-linecap="round" opacity=".35"/>

  <!-- ══ La persona recién egresada, en el suelo, con el brazo levantado ══ -->
  <ellipse cx="300" cy="300" rx="46" ry="6" fill="#132B41" opacity=".08"/>
  <circle cx="300" cy="222" r="16" fill="#3A93D0"/>
  <path d="M276 300 L276 258 Q276 240 300 240 Q324 240 324 258 L324 300 Z" fill="#3A93D0"/>
  <line x1="320" y1="254" x2="346" y2="198" stroke="#3A93D0" stroke-width="8" stroke-linecap="round"/>
  <!-- el birrete -->
  <path d="M300 194 l30 9 l-30 9 l-30 -9 z" fill="#00417B"/>
  <path d="M286 207 v7 q14 6 28 0 v-7 z" fill="#00417B" opacity=".6"/>
  <line x1="270" y1="203" x2="270" y2="218" stroke="#00417B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="270" cy="221" r="3.5" fill="#00417B"/>

  <!-- Los rótulos: las palabras del DI -->
  <g font-family="Manrope, system-ui, sans-serif" font-size="17" font-weight="600" fill="#132B41" text-anchor="middle">
    <text x="300" y="346">al finalizar el programa</text>
    <text x="670" y="346">diez años de experiencia</text>
  </g>
</svg>
